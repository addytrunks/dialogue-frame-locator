# Default configuration (DESIGN.md §16.3).
# Every tunable used anywhere in the pipeline is named here, even though
# nothing reads most of these yet in Phase 0 — no magic numbers in code,
# and nothing should need renaming later.

asr:
  provider: openrouter          # openrouter (primary) | local (faster-whisper fallback)
  openrouter:
    model: openai/whisper-large-v3
    provider_pin: ["openai"]    # backing hosts that honor verbose_json + word timestamps
    api_key_env: OPENROUTER_API_KEY
  local:
    model: large-v3
  chunk_seconds: 22.0
  chunk_overlap_seconds: 1.5
  early_stop: false             # D6 — off by default, correctness-preserving

language:
  default: en
  auto_detect: false

match:
  thresholds:
    # tau_accept calibrated against the "at" vs "against" discriminator
    # (DESIGN.md §8.3): CascadeMatcher's lexical*phonetic formula scores that
    # single-content-word substitution at ~0.75 with the default weights, so
    # tau_accept sits at 0.80 to keep a clear margin — that case must land
    # as a near-match/AMBIGUOUS, never silently accepted as exact.
    tau_accept: 0.80
    tau_reject: 0.40
    delta: 0.05                # AMBIGUOUS band: other candidate within best * (1 - delta)
    tau_c: 0.60                # minimum fused confidence required for FOUND
  weights:
    lexical: 0.6
    phonetic: 0.2
    semantic: 0.2
  semantic_guard:
    enabled: false
    provider: openrouter                    # provider-agnostic key (Phase 4 revision: OpenRouter, not Ollama — see DECISIONS.md)
    model: openai/text-embedding-3-small    # embedding model; scored via cosine similarity, not a chat call
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 15.0
    # The matcher scores every sliding window with the cheap lexical+phonetic
    # signals first, then calls the semantic guard only on the top-scoring
    # windows by that partial score — never on all of them. Without this cap,
    # a long transcript means one OpenRouter call per word position (tens of
    # thousands per run), not "an occasional tie-breaker."
    max_candidates_to_score: 8
  confidence:
    # Signal fusion weights for the proxy confidence (DESIGN.md §10.2/§10.5).
    # provider_confidence only enters the mix when the transcript carries
    # native per-word confidence (e.g. the local faster-whisper fallback);
    # when absent (the pinned OpenRouter path), weight is redistributed
    # across the remaining signals.
    weights:
      match_score: 0.7
      vad_agreement: 0.1
      provider_confidence: 0.2
    vad_agreement_placeholder: 1.0  # neutral value used when no VAD check has run
                                    # (dfl.localize.refine supplies the real one)
    # When the VAD vetoes an onset (refine reports vad_ok=False), status is
    # capped at AMBIGUOUS and confidence at this value. Must stay below tau_c,
    # so the reported number can never read as acceptable while the status says
    # otherwise. Not zero: the text still matched, and the VAD may simply have
    # missed quiet speech under music — the candidate is doubted, not erased.
    vad_reject_ceiling: 0.50

# Temporal refinement (DESIGN.md §6.3/§6.4) — turning the matched word span's
# onset t0 into t*. Phase 5.
refine:
  vad:
    # Silero VAD v6, run through faster-whisper's bundled ONNX copy (no extra
    # dependency, no download). Defaults tuned for onset precision, not for
    # utterance segmentation:
    threshold: 0.5                 # Silero's own recommended default
    min_speech_duration_ms: 100    # drop blips that would fake a speech region
    min_silence_duration_ms: 200   # faster-whisper's 2000ms default glues whole
                                   # dialogue exchanges into one region, which
                                   # destroys the boundary we want to snap to
    speech_pad_ms: 0               # its 400ms default moves every region start
                                   # 400ms earlier — fatal for an onset estimate
    tolerance_seconds: 0.20        # word timestamps are ±0.1-0.3s (§6.2), so an
                                   # onset this close to a region still counts as
                                   # "in speech", just at half trust
    window_pad_seconds: 2.0        # VAD is run over [t0-2s, t_end+2s] only
  snap:
    # §6.3's second VAD role: pull a slightly-late word timestamp back onto the
    # speech-region start. Bounded, because a matched phrase may legitimately
    # begin mid-utterance and must never be dragged to the sentence start.
    enabled: true
    max_delta_seconds: 0.25
  alignment:
    enabled: true
    trigger_score: 0.80            # == match.thresholds.tau_accept: anything not
                                   # cleanly accepted is worth realigning
    trigger_word_confidence: 0.60  # native per-word confidence, when the provider reports it
    window_pad_seconds: 1.0        # §6.4 step 4: align over [t0-1s, t_end+1s]
    max_shift_seconds: 0.5         # refinement may sharpen an onset, not relocate it.
                                   # Word timestamps are ±0.1-0.3s (§6.2), so an
                                   # aligned onset half a second from t0 is a
                                   # disagreement about *which* words these are,
                                   # not a sharper measurement of the same ones —
                                   # keep t0, which is the safer of two answers.
    # The alignment model, independent of asr.local.model: aligning known text
    # is far easier than transcribing, so `small` is enough and keeps the
    # conditional refinement affordable. Language comes from language.default,
    # not from a second key here.
    model: small
    device: auto                   # auto | cpu | cuda
    compute_type: default          # e.g. int8 on CPU, float16 on GPU

media:
  max_size_mb: 2048
  max_duration_seconds: 14400
  timeout_seconds: 300

output:
  dir: ./out

detector:
  default: asr                 # asr (this pass) | ocr (future, not implemented)
