[project]
name = "dfl"
version = "0.0.1"
description = "Dialogue-to-Frame Localization: find the exact video frame at which a dialogue line is spoken."
requires-python = ">=3.11"  # floor raised from 3.10 in Phase 2: PyAV 18 requires it
dependencies = [
    "PyYAML==6.0.3",
    "yt-dlp==2026.8.19",
    "curl_cffi==0.16.1", # optional at runtime (resolver falls back gracefully without it),
    # but required to resolve sites like ok.ru that reject yt-dlp's
    # plain request handler and only work with browser impersonation
    "av==18.1.0",     # PyAV: ffmpeg bindings behind media/frames.py — chosen over
                      # shelling out to the ffmpeg CLI because exact-frame extraction
                      # needs each decoded frame's real PTS (DESIGN.md §9.2), which the
                      # CLI does not hand back reliably. Pinned: decoder behavior is
                      # the correctness surface of this phase.
    "pillow==12.3.0", # lossless PNG writing of the extracted frame (DESIGN.md §9.4)
    "httpx==0.28.1",  # OpenRouterAsrProvider's HTTP client (DESIGN.md §7.5) — pinned to the
                      # version faster-whisper's own dependency chain already resolves to,
                      # so there is one version of it in the environment, not two.
    "faster-whisper==1.2.1",  # local ASR fallback, word-level timestamps (DESIGN.md §7.3)
    "python-dotenv==1.2.3",   # loads OPENROUTER_API_KEY from .env into the environment
                              # (DESIGN.md §7.5 — env/.env only, never hardcoded)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]
demo = [
    "streamlit==1.62.0",  # Phase 8: optional read-only UI over pipeline.run() (DESIGN.md §2.3
                          # exception, see DECISIONS.md) — not required for the CLI (D1-D11).
]

[project.scripts]
localize = "dfl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
