[project]
name = "dfl"
version = "0.0.1"
description = "Dialogue-to-Frame Localization: find the exact video frame at which a dialogue line is spoken."
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
localize = "dfl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
